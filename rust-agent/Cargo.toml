[package]
name = "rust-agent"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
hostname = "0.4.2"
reqwest = { version = "0.13.5", features = ["blocking","json"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "time"] }
uuid = { version = "1.29.0", features = ["serde"] }
